[package]
name = "winraze"
version = "0.1.0"
edition = "2021"
authors = []
description = "WinRaze: Raze the bloat. Reclaim your Windows. Powered by Rust. 🦀"

[dependencies]
winreg = "0.52"
walkdir = "2.5"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
indicatif = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_FileSystem"
] }
eframe = "0.29"
rfd = "0.15"

[[bin]]
name = "winraze"
path = "src/main.rs"

[[bin]]
name = "DeRust"
path = "src/main.rs"
